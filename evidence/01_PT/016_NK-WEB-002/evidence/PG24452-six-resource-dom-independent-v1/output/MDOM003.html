<!doctype html>
<!-- SCR013/FUN007/UI223235/SS313/PG-D365/PT-CONTENT. API stored pair/order only. -->
<html lang="ja">
 <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music</title>
  <link rel="stylesheet" href="/css/schubert.css">
 </head>
 <body>
  <main class="page">
   <header class="topbar">
    <div>
     <h1>Music</h1>
     <div class="subtitle">0曲</div>
    </div>
    <div class="topbar-actions">
     <div class="topbar-actions">
      <nav class="nav-links" aria-label="共通ナビゲーション">
       <a href="/">メニュー</a> <a href="/notifications">通知</a>
      </nav>
      <span class="login-user">fixture-reader</span> <span class="login-role">USER</span>
      <form class="logout-form" action="/logout" method="post">
       <button type="submit">ログアウト</button>
      </form>
     </div>
     <nav class="nav-links">
      <a href="/music">音楽</a> <a href="/music/BGM">BGM</a><a href="/search">検索</a>
     </nav>
    </div>
   </header>
   <section class="music-list">
    <article class="music-row song-row">
     <div class="music-info">
      <strong>both</strong>
     </div>
     <div class="song-players">
      <div class="song-player">
       <span>メイン</span> <audio controls preload="none" src="/music/media/main"></audio> <a class="download" href="/music/download/main">DL</a>
      </div>
      <div class="song-player">
       <span>インスト</span> <audio controls preload="none" src="/music/media/inst"></audio> <a class="download" href="/music/download/inst">DL</a>
      </div>
     </div>
    </article>
    <article class="music-row song-row">
     <div class="music-info">
      <strong>main-only</strong>
     </div>
     <div class="song-players">
      <div class="song-player">
       <span>メイン</span> <audio controls preload="none" src="/music/media/main"></audio> <a class="download" href="/music/download/main">DL</a>
      </div>
      <span class="song-player-placeholder">インストなし</span>
     </div>
    </article>
    <article class="music-row song-row">
     <div class="music-info">
      <strong>inst-only</strong>
     </div>
     <div class="song-players">
      <span class="song-player-placeholder">メインなし</span>
      <div class="song-player">
       <span>インスト</span> <audio controls preload="none" src="/music/media/inst"></audio> <a class="download" href="/music/download/inst">DL</a>
      </div>
     </div>
    </article>
    <article class="music-row song-row">
     <div class="music-info">
      <strong>neither</strong>
     </div>
     <div class="song-players">
      <span class="song-player-placeholder">メインなし</span> <span class="song-player-placeholder">インストなし</span>
     </div>
    </article>
   </section>
  </main>
 </body>
</html>
