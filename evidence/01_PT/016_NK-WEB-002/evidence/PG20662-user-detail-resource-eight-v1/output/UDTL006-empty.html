<html lang="ja">
 <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User詳細</title>
  <link rel="stylesheet" href="/css/schubert.css">
 </head>
 <body>
  <main class="page user-detail">
   <header class="topbar">
    <h1>User詳細</h1>
    <div class="topbar-actions">
     <nav class="nav-links" aria-label="共通ナビゲーション">
      <a href="/">メニュー</a> <a href="/notifications">通知</a>
     </nav>
     <span class="login-user">public-admin</span> <span class="login-role">ADMIN</span>
     <form class="logout-form" action="/logout" method="post">
      <button type="submit">ログアウト</button>
     </form>
    </div>
   </header>
   <nav>
    <a href="/admin/users">User一覧</a>
   </nav>
   <dl>
    <dt>Username</dt>
    <dd class="username">&lt;script&gt;fixture&lt;/script&gt;&amp;</dd>
    <dt>Role</dt>
    <dd class="role">USER</dd>
    <dt>状態</dt>
    <dd class="state">有効</dd>
    <dt>Lock理由</dt>
    <dd class="lock-reason">手動確認</dd>
    <dt>Lock終了日時</dt>
    <dd class="locked-until"></dd>
    <dt>最終Login日時</dt>
    <dd class="last-login"></dd>
    <dt>Active session数</dt>
    <dd class="active-sessions">2</dd>
    <dt>最終Password変更日時</dt>
    <dd class="password-changed-at"></dd>
    <dt>作成日時</dt>
    <dd class="created-at"></dd>
    <dt>更新日時</dt>
    <dd class="updated-at"></dd>
    <dt>作成actor</dt>
    <dd class="created-by">creator</dd>
    <dt>更新actor</dt>
    <dd class="updated-by">updater</dd>
   </dl>
  </main>
  <script src="/js/operation-post-submit.js" defer></script>
 </body>
</html>
