<!doctype html>
<!-- NK-WEB-002/SCR020/NTF/UI224,236/SS313,332/PG-D347/PT-NTF-HTTP001..010. -->
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>通知</title>
    <link rel="stylesheet" href="/css/schubert.css">
  </head>
<body><main class="page notification-page">
  <header class="topbar"><h1>通知</h1><div class="topbar-actions">
        <nav class="nav-links" aria-label="共通ナビゲーション">
          <a href="/">メニュー</a>
          <a href="/notifications">通知</a>
        </nav>
        <span class="login-user">reader</span>
        <span class="login-role">USER</span>
        <form class="logout-form" action="/logout" method="post">
          <button type="submit">ログアウト</button>
        </form>
      </div></header>
  <div id="notification-errors" role="alert" hidden="hidden"><ul></ul></div>
  <form method="get" action="/notifications">
    <label>通知区分<select name="type" aria-describedby="notification-errors">
      <option value="">すべて</option>
      <option value="ACCEPTED">受付通知</option>
      <option value="COMPLETED" selected="selected">処理済通知</option>
      <option value="ERROR">エラー通知</option>
    </select></label>
    <label>受付日From<input type="date" name="from" value="" aria-describedby="notification-errors"></label>
    <label>受付日To<input type="date" name="to" value="" aria-describedby="notification-errors"></label>
    <button type="submit">検索</button>
  </form>
  <p class="count">0 notifications / page 1 of 1</p>
  <nav aria-label="ページ"></nav>
  <section>
    <p class="empty-results">該当するデータはありません</p>
    
  </section>
</main></body></html>
