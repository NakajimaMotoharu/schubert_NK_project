# NK-OPS-001; UI251; SS342 section3/SSC178; CADDY455001002.
# Fixed high port needs no capabilities. Keep daemon ABI, never fabricate a worker receipt.
[Unit]
# SS342 4.1; PT-OPS-UNIT-SUP006. The parent still performs the separate Web readiness check.
After=schubert-nk-web.service
Requires=schubert-nk-web.service

[Service]
User=caddy
Group=caddy
SupplementaryGroups=
Type=notify
Restart=no
TimeoutStartSec=30s
TimeoutStopSec=30s
SendSIGKILL=no
KillMode=control-group
NoNewPrivileges=yes
CapabilityBoundingSet=
AmbientCapabilities=
UMask=0027
ProtectSystem=strict
ProtectHome=true
PrivateTmp=true
ReadWritePaths=/var/lib/caddy
ExecStartPre=
ExecStartPre=/usr/bin/caddy validate --config /etc/caddy/Caddyfile
ExecStart=
ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile
ExecReload=
