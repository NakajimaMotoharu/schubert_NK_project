# NK-OPS-001; OPS-009; UI251; SS341/343; SSC-049/089/092/104; PG-D-147.
# PT-OPS-LOCK-008; BUG-318/YKT-251.
# Install root-owned into /usr/lib/tmpfiles.d via the reviewed release, before boot provisioning.
# Boot only. Never re-run or replace/unlink the lock while maintenance or another holder exists.
# f (not f+) creates only when absent; no truncate, age cleanup, recursive delete or glob.
# Admission never repairs existing metadata; a rejected deployment requires operator diagnosis.
d! /run/schubert-nk 0755 root root -
d! /run/schubert-nk/maintenance 0700 root root -
d! /run/schubert-nk/startup 0700 root root -
d! /run/schubert-nk/backup-request 0700 root root -
d! /run/schubert-nk/cleanup-request 0700 root root -
f! /run/schubert-nk/maintenance.lock 0600 root root -
f! /run/schubert-nk/startup-admission.lock 0600 root root -
