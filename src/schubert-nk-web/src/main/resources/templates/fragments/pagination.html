<!doctype html>
<!-- NK-WEB-001/002/FUN003/008; UI222/223/225; SS313; PG202/216, PT-SCR028/086. -->
<html lang="ja" xmlns:th="http://www.thymeleaf.org"><body>
  <nav th:fragment="results(page, bottom, label)" class="pagination" th:classappend="${bottom} ? 'bottom-nav' : ''"
       th:aria-label="${bottom} ? ${label + ' bottom'} : ${label}"
       th:if="${page.results.present and !page.results.orElseThrow().page.empty}">
    <a th:if="${page.previousHref.present}" th:href="${page.previousHref.orElseThrow()}">前の100件</a>
    <span th:if="${!page.previousHref.present}">前の100件</span>
    <div>
      <span th:text="${page.results.orElseThrow().page.firstResult}"></span>
      <span>-</span>
      <span th:text="${page.results.orElseThrow().page.lastResult}"></span>
      <span>/</span>
      <span th:text="${page.results.orElseThrow().page.totalCount}"></span>
    </div>
    <a th:if="${page.nextHref.present}" th:href="${page.nextHref.orElseThrow()}">次の100件</a>
    <span th:if="${!page.nextHref.present}">次の100件</span>
  </nav>
</body></html>
