<input th:fragment="operationToken(value)" type="hidden" name="operation_token" th:value="${value}">
<input th:fragment="csrfField(name, value)" type="hidden" th:name="${name}" th:value="${value}">
<p th:fragment="fieldError(issues, field, style)" th:if="${issues.containsKey(field)}" th:class="${style}" th:text="${issues.get(field)}"></p>
