<!doctype html>
<!-- SCR010/FUN006/UI223235/SS313/PG-D365/PT-CONTENT. Closed display map only. -->
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head(${page.values.title})}"></head>
  <body><main class="page video-page">
    <header class="topbar"><div>
      <h1 th:text="${page.values.title}"></h1>
      <div class="subtitle" th:text="|${page.values.category} / ${page.values.displayPath}|"></div>
    </div><div class="topbar-actions">
      <div th:replace="~{fragments/layout :: userActions(${page.values.topBar})}"></div>
      <nav class="nav-links"><a th:href="@{/animation}">アニメ視聴</a>
        <a th:href="${page.values.backHref}" th:text="${page.values.backLabel}"></a>
      </nav>
    </div></header>
    <section class="video-shell"><video th:replace="~{fragments/media :: videoPlayer(${page.values.mediaHref})}"></video></section>
  </main></body>
</html>
