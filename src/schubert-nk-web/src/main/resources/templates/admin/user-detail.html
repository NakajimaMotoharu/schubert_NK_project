<!doctype html>
<!-- NK-WEB-002/SCR017/UI225236/SS313314/SSC177/PG-D366/PT-USER-BIZ001..012. -->
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('User詳細')}"></head>
<body><main class="page user-detail">
  <header class="topbar"><h1>User詳細</h1><div th:replace="~{fragments/layout :: userActions(${page.topBar})}"></div></header>
  <nav><a th:href="@{/admin/users}">User一覧</a></nav>
  <dl>
    <dt>Username</dt><dd class="username" th:text="${page.values.username}"></dd>
    <dt>Role</dt><dd class="role" th:text="${page.values.role}"></dd>
    <dt>状態</dt><dd class="state" th:text="${page.values.state}"></dd>
    <dt>Lock理由</dt><dd class="lock-reason" th:text="${page.values.lockReason}"></dd>
    <dt>Lock終了日時</dt><dd class="locked-until" th:text="${page.values.lockedUntil}"></dd>
    <dt>最終Login日時</dt><dd class="last-login" th:text="${page.values.lastLogin}"></dd>
    <dt>Active session数</dt><dd class="active-sessions" th:text="${page.values.activeSessionCount}"></dd>
    <dt>最終Password変更日時</dt><dd class="password-changed-at" th:text="${page.values.passwordChangedAt}"></dd>
    <dt>作成日時</dt><dd class="created-at" th:text="${page.values.createdAt}"></dd>
    <dt>更新日時</dt><dd class="updated-at" th:text="${page.values.updatedAt}"></dd>
    <dt>作成actor</dt><dd class="created-by" th:text="${page.values.createdBy}"></dd>
    <dt>更新actor</dt><dd class="updated-by" th:text="${page.values.updatedBy}"></dd>
  </dl>
  <p role="alert" th:if="${message != null and !message.empty}" th:text="${message}"></p>
  <section class="user-operations" th:if="${forms != null}">
    <form th:each="form : ${forms}" th:id="${'user-' + form.operation + '-form'}" method="post" th:action="@{/admin/users/{id}(id=${page.values.id})}" th:attr="data-operation=${form.operation}">
      <input type="hidden" name="operation" th:value="${form.operation}">
      <input type="hidden" name="id" th:value="${form.fields.id}">
      <input type="hidden" name="expected_version" th:value="${form.fields.expected_version}">
      <input type="hidden" name="operation_token" th:value="${form.token}">
      <ul class="validation-summary" th:if="${!form.issues.empty}"><li th:each="issue : ${form.issues}">
        <a th:href="${'#user-' + form.operation + '-' + (issue.key == 'confirm' or issue.key == 'role' or issue.key == 'password' or issue.key == 'password_confirmation' ? issue.key : 'form')}" th:text="${issue.value}"></a>
      </li></ul>
      <div th:if="${form.operation == 'STATUS'}"><input type="hidden" name="enabled" th:value="${form.fields.enabled}"><span th:text="${form.fields.enabled ? '有効化' : '無効化'}"></span></div>
      <label th:if="${form.operation == 'ROLE'}" for="user-ROLE-role">Role <span class="required-label">必須</span><select id="user-ROLE-role" name="role" required><option value="USER" th:selected="${form.fields.role == 'USER'}">USER</option><option value="ADMIN" th:selected="${form.fields.role == 'ADMIN'}">ADMIN</option></select></label>
      <div th:if="${form.operation == 'PASSWORD'}"><label for="user-PASSWORD-password">新Password <span class="required-label">必須</span><input id="user-PASSWORD-password" type="password" name="password" required autocomplete="new-password"></label><label for="user-PASSWORD-password_confirmation">Password確認 <span class="required-label">必須</span><input id="user-PASSWORD-password_confirmation" type="password" name="password_confirmation" required autocomplete="new-password"></label></div>
      <span th:if="${form.operation == 'UNLOCK'}">Lock解除</span>
      <label th:for="${'user-' + form.operation + '-confirm'}"><input th:id="${'user-' + form.operation + '-confirm'}" type="checkbox" name="confirm" value="true" required>確認 <span class="required-label">必須</span></label>
      <button type="submit">実行</button>
    </form>
  </section>
</main></body></html>
