<!doctype html>
<!-- SCR016/UI225236/SS313314/SSC177/PG-D366/PT-USER-BIZ001..012. No retained password. -->
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('User追加')}"></head>
<body><main class="page user-new">
  <header class="topbar"><h1>User追加</h1><div th:replace="~{fragments/layout :: userActions(${page.values.topBar})}"></div></header>
  <nav><a th:href="@{/admin/users}">User一覧</a></nav>
  <p role="alert" th:if="${!page.values.message.empty}" th:text="${page.values.message}"></p>
  <ul th:replace="~{fragments/error-summary :: validationList(${page.values.issues})}"></ul>
  <form method="post" data-operation-submit th:action="@{/admin/users/new}">
    <input type="hidden" name="operation_token" th:replace="~{fragments/forms :: operationToken(${page.values.token})}">
    <label>Username（必須）<input name="username" required maxlength="64" th:value="${page.values.fields.username}"></label>
    <p th:replace="~{fragments/forms :: fieldError(${page.values.issues}, 'username', 'field-error username-error')}"></p>
    <label>初期Password（必須）<input type="password" name="password" required autocomplete="new-password"></label>
    <label>Password確認（必須）<input type="password" name="password_confirmation" required autocomplete="new-password"></label>
    <label>Role（必須）<select name="role" required><option value="USER" th:selected="${page.values.fields.role == 'USER'}">USER</option><option value="ADMIN" th:selected="${page.values.fields.role == 'ADMIN'}">ADMIN</option></select></label>
    <label>有効（必須）<select name="enabled" required><option value="true" th:selected="${page.values.fields.enabled}">有効</option><option value="false" th:selected="${!page.values.fields.enabled}">無効</option></select></label>
    <button type="submit">作成</button>
  </form>
</main><script src="/js/operation-post-submit.js" defer></script></body></html>
