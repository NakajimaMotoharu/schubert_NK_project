<head th:replace="~{fragments/layout :: head('質問受付完了')}"></head>

  <p class="accepted-message">質問を受け付けました。</p>

    <dt>質問</dt><dd class="question-body" th:text="${page.values.question}"></dd></dl>
  <nav><a href="/notifications">通知を確認</a><a href="/questions/new">続けて質問</a><a th:href="@{/}">メニュー</a></nav>
