<!doctype html>
<!-- SCR023/UI224236/SS313314/PG-D350368/PT-QRY-HTTP008,QDL-BIZ; QA049 approved. -->
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('質問回答明細')}"></head>
<body><main class="page question-detail-page">
  <header class="topbar"><h1>質問回答明細</h1><div th:replace="~{fragments/layout :: userActions(${page.topBar})}"></div></header>
  <dl><dt>受付ID</dt><dd class="receipt" th:text="${page.values.receiptId}"></dd>
    <dt th:if="${page.values.admin}">利用者</dt><dd class="owner" th:if="${page.values.admin}" th:text="${page.values.username}"></dd>
    <dt>受付日時</dt><dd class="submitted-at" th:text="${page.values.submittedAt}"></dd>
    <dt>回答状態</dt><dd class="state" th:text="${page.values.stateLabel}"></dd>
    <dt>質問</dt><dd class="question-body" th:text="${page.values.question}"></dd>
    <dt th:if="${page.values.answerAvailable}">回答</dt><dd class="answer-body" th:if="${page.values.answerAvailable}" th:text="${page.values.answer.empty ? '（空の回答）' : page.values.answer}"></dd>
    <dt th:if="${page.values.answerAvailable}">回答日時</dt><dd class="answered-at" th:if="${page.values.answerAvailable}" th:text="${page.values.answeredAt}"></dd>
  </dl>
  <p class="operation-notice" role="alert" th:if="${notice != null and !notice.empty}" th:text="${notice}"></p>
  <section id="delete-confirm" th:if="${action != null}">
    <h2>質問・回答の削除確認</h2>
    <p class="delete-summary" th:text="${page.values.summary}"></p>
    <div th:replace="~{fragments/error-summary :: operationErrors(${action.issues})}"></div>
    <form class="delete-form" method="post" data-operation-submit th:action="${'/questions/' + page.values.id}">
      <input type="hidden" name="operation" value="DELETE">
      <input type="hidden" name="id" th:value="${action.fields.id}">
      <input type="hidden" name="operation_token" th:replace="~{fragments/forms :: operationToken(${action.fields.operation_token})}">
      <input type="hidden" th:replace="~{fragments/forms :: csrfField(${_csrf.parameterName}, ${_csrf.token})}">
      <label><input type="checkbox" name="confirm" value="true" th:checked="${action.fields.confirm}" required>質問・回答の削除を確認しました（必須）</label>
      <button type="submit">質問・回答を削除</button>
    </form>
  </section>
  <a class="back" href="/questions">質問回答一覧</a>
</main><script src="/js/operation-post-submit.js" defer></script></body></html>
