<!doctype html>
<!-- SCR013/FUN007/UI223235/SS313/PG-D365/PT-CONTENT. API stored pair/order only. -->
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head(${page.values.title})}"></head>
  <body><main class="page">
    <header class="topbar"><div><h1 th:text="${page.values.title}"></h1>
      <div class="subtitle" th:text="|${page.values.trackCount}曲|"></div>
    </div><div class="topbar-actions">
      <div th:replace="~{fragments/layout :: userActions(${page.values.topBar})}"></div>
      <nav class="nav-links" aria-label="曲一覧のナビゲーション"><a th:href="@{/music}">音楽</a>
        <a th:href="${page.values.categoryHref}" th:text="${page.values.category}"></a><a th:href="@{/search}">検索</a>
      </nav>
    </div></header>
    <section class="music-list" th:if="${!page.values.songs}">
      <article class="music-row" th:each="track : ${page.values.tracks}">
        <div class="music-info"><strong th:text="${track.title}"></strong>
          <span class="scenario-meta"><span th:text="${track.displayPath}"></span>
            <span th:text="${#numbers.formatDecimal(track.byteSize / 1024.0 / 1024.0, 1, 1) + ' MB'}"></span>
          </span></div>
        <div class="music-player"><audio th:replace="~{fragments/media :: audioPlayer(${track.mediaHref})}"></audio>
          <a th:replace="~{fragments/media :: downloadLink(${track.downloadHref})}"></a></div>
      </article>
    </section>
    <section class="music-list" th:if="${page.values.songs}">
      <article class="music-row song-row" th:each="pair : ${page.values.pairs}">
        <div class="music-info"><strong th:text="${pair.title}"></strong></div>
        <div class="song-players">
          <div class="song-player" th:if="${pair.main.present}"><span>メイン</span>
            <audio th:replace="~{fragments/media :: audioPlayer(${pair.main.orElseThrow().mediaHref})}"></audio>
            <a th:replace="~{fragments/media :: downloadLink(${pair.main.orElseThrow().downloadHref})}"></a></div>
          <span class="song-player-placeholder" th:if="${!pair.main.present}">メインなし</span>
          <div class="song-player" th:if="${pair.instrumental.present}"><span>インスト</span>
            <audio th:replace="~{fragments/media :: audioPlayer(${pair.instrumental.orElseThrow().mediaHref})}"></audio>
            <a th:replace="~{fragments/media :: downloadLink(${pair.instrumental.orElseThrow().downloadHref})}"></a></div>
          <span class="song-player-placeholder" th:if="${!pair.instrumental.present}">インストなし</span>
        </div>
      </article>
    </section>
  </main></body>
</html>
