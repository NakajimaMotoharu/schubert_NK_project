<!doctype html>
<!-- NK-WEB-002/SCR005/FUN004; UI221..223/234; SS313; SSC071/PG194/PT-SCR-001..016. -->
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head(${page.game + ' Routes'})}"></head>
  <body><main class="page">
    <header class="topbar">
      <div><span class="brand" th:text="${page.topBar.brand}"></span>
        <h1 th:text="${page.game}"></h1><div class="subtitle">シナリオルート選択</div></div>
      <div th:replace="~{fragments/layout :: userActions(${page.topBar})}"></div>
    </header>
    <nav class="nav-links" aria-label="Scenarioナビゲーション">
      <a th:href="@{${page.upHref}}">ゲーム選択</a>
      <a th:href="@{/search}">検索</a>
    </nav>
    <section class="scenario-list">
      <a class="scenario-link" th:each="route : ${page.routes}" th:href="@{${route.href}}">
        <span class="scenario-title" th:text="${route.title}"></span>
        <span class="scenario-meta">
          <span th:text="${page.game}"></span>
          <span th:text="${route.fileCount + ' files'}"></span>
        </span>
      </a>
    </section>
  </main></body>
</html>
